<article class="card-hover rounded-3xl border border-gray-200 bg-white p-8 shadow-sm">
    <p class="text-sm font-semibold text-blue-700 mb-3">{{card.category}}</p>
    <h2 class="text-2xl font-bold tracking-tight mb-4">{{card.title}}</h2>
    <p class="text-gray-600 leading-8 mb-6">{{card.description}}</p>
    <a href="{{card.href}}" class="inline-flex items-center font-semibold text-blue-700 hover:text-blue-800 transition-colors">{{card.cta}}</a>
</article>
