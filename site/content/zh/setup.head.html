        .toc-link {
            display: block;

        }
        .toc-link:hover {
            color: #2563eb;
        }
        .toc-link.active {
            color: #2563eb;
            border-left-color: #2563eb;
            font-weight: 600;
        }

            padding-left: 2rem;
            font-size: 0.8125rem;
        }
        .toc-title {
            font-size: 0.875rem;
            font-weight: 700;

            letter-spacing: 0.05em;
        }
        .image-strip {

        }

            background: rgba(148, 163, 184, 0.5);
            border-radius: 999px;
        }
        .image-card {
            min-width: 240px;
            max-width: 280px;
            flex: 0 0 auto;
            scroll-snap-align: start;
        }
        .image-card img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 1rem;
            border: 1px solid #e5e7eb;
            box-shadow: 0 12px 30px -20px rgba(15, 23, 42, 0.45);
            background: white;
        }
        @media (min-width: 1400px) {
            .toc-sidebar,
            .related-sidebar {
                display: block;
                position: absolute;
                top: 0;
            }
            .toc-sidebar {
                left: calc(50% - 490px - 32px - 220px);
            }
            .related-sidebar {
                left: calc(50% + 490px + 32px);
            }
        }
        @media (min-width: 768px) {
            .image-card {
                min-width: 280px;
                max-width: 320px;
            }
        }
